<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Money Pro | v9.1</title>
    <link rel="manifest" href="manifest.json?v=9.1.1">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon_192.png">
    <link rel="stylesheet" href="style.css?v=9.1.1">
    <style>
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;}
        .modal-card{width:85%;max-width:320px;text-align:center;padding:25px;background:#1e293b;border-radius:15px;border:1px solid #3b82f6;}
        .admin-box{background:rgba(59,130,246,0.15);border-right:4px solid #3b82f6;padding:15px;border-radius:10px;margin-bottom:15px;font-size:14px;color:#fff;position:relative;text-align:right;}
        .edit-admin-btn{background:none;border:none;color:#3b82f6;cursor:pointer;font-size:18px;position:absolute;left:10px;top:10px;opacity:0.7;}
        .fade-in{animation:fadeIn 0.4s ease-in;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        body{-webkit-user-select:none;user-select:none;}
        .topbar button.active{background:rgba(59,130,246,0.2);border-bottom:2px solid #3b82f6;color:#fff;}
        .btn-work{position:relative;overflow:hidden;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:12px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;width:100%;transition:0.2s;}
        .progress-overlay{position:absolute;bottom:0;left:0;height:4px;background:var(--blue);width:0%;transition:width linear;}
        .gang-card{border:1px solid #444;padding:10px;border-radius:8px;margin-bottom:10px;background:rgba(255,255,255,0.02);}
        .gang-active{border-color:var(--blue);background:rgba(59,130,246,0.1);}
    </style>
</head>
<body class="dark-theme">
<header class="main-header">
    <img src="logo.png" alt="Smart Money Pro" class="header-logo-big" onclick="if(window.openTab) window.openTab('home')" style="cursor:pointer;">
</header>
<div class="stats-bar-top">
    <div class="stat-item">💰 <span id="money">0</span>₪</div>
    <div class="stat-item">🏦 <span id="bank">0</span>₪</div>
    <div class="stat-item">⭐ רמה <span id="life-level-ui">1</span></div>
</div>
<div id="status-bar" class="status-msg" style="display:flex;justify-content:space-between;align-items:center;padding:0 15px;">
    <span id="status-text">המערכת מוכנה...</span>
    <span id="event-timer" style="font-family:monospace;font-size:13px;opacity:0.8;background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);">01:00</span>
</div>
<nav class="topbar">
    <div class="nav-row">
        <button onclick="window.openTab('home')"     id="btnHome">🏠 בית</button>
        <button onclick="window.openTab('work')"     id="btnWork">⚒️ עבודות</button>
        <button onclick="window.openTab('black')"    id="btnBlack">🕶️ שוק שחור</button>
    </div>
    <div class="nav-row">
        <button onclick="window.openTab('estate')"   id="btnEstate">🏠 נדל"ן</button>
        <button onclick="window.openTab('business')" id="btnBusiness">🏢 עסקים</button>
        <button onclick="window.openTab('staff')"    id="btnStaff">👥 צוות</button>
    </div>
    <div class="nav-row">
        <button onclick="window.openTab('skills')"   id="btnSkills">🎓 כישורים</button>
        <button onclick="window.openTab('bank')"     id="btnBank">🏦 בנק</button>
        <button onclick="window.openTab('cars')"     id="btnCars">🚗 רכבים</button>
    </div>
    <div class="nav-row">
        <button onclick="window.openTab('shop')"     id="btnShop">🛒 חנות</button>
        <button onclick="location.reload()" class="sys-btn">רענון🔄</button>
        <button onclick="document.getElementById('installModal').style.display='flex'" class="sys-btn">התקנה📲</button>
        <button id="btnGuide" onclick="openTab('guide')">📖 מדריך</button>
    </div>
</nav>
<main id="content" class="fade-in container"></main>
<div id="installModal" class="modal-overlay" onclick="closeInstallGuide()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3>📲 התקנת אפליקציה</h3>
        <p id="android-instr">לחץ על 3 הנקודות בדפדפן<br>ובחר "התקן אפליקציה".</p>
        <p id="ios-instr" style="display:none;">לחץ על כפתור ה"שתף"<br>ואז "הוסף למסך הבית".</p>
        <button class="action" onclick="closeInstallGuide()" style="background:#ef4444;color:#fff;width:100%;margin-top:15px;border-radius:8px;">סגור</button>
    </div>
</div>
<footer class="main-footer">© 2026 Smart Money Pro v9.1.1 | אלכסיי זבודיסקר</footer>
<!-- Firebase SDK - נטען ראשון -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({
        databaseURL: "https://smart-money-faf43-default-rtdb.europe-west1.firebasedatabase.app"
    });
</script>

<!-- סדר טעינה נכון: events → core → activities → economy → ui → blackmarket -->

<script src="js/events.js?v=9.1.1"></script>

<script src="js/core.js?v=9.1.1"></script>

<script defer src="js/activities.js?v=9.1.1"></script>

<script defer src="js/economy.js?v=9.1.1"></script>

<script defer src="js/ui.js?v=9.1.1"></script>

<script defer src="js/blackmarket.js?v=9.1.1"></script>

<script>
    function closeInstallGuide() { document.getElementById('installModal').style.display = 'none'; }
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=9.1.1').then(function() { console.log("SW v9.1"); });
    }
    window.addEventListener('load', function() {
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.getElementById('android-instr').style.display = 'none';
            document.getElementById('ios-instr').style.display = 'block';
        }
    });
</script>

<div id="player-start" class="start-screen">
    <div class="start-box">
        <h2>ברוך הבא ל Smart Money</h2>
        <p>בחר שם לשחקן</p>
        <input id="player-name-input" placeholder="שם שחקן">
        <button onclick="savePlayerName()">התחל משחק</button>
    </div>
</div>
</body>
</html>
